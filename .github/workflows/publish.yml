name: Publish

# Mirrors glass_goals's publish workflow (OIDC trusted publishing, skip
# versions already on npm), triggered from this repo's master branch.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @thkp-eng/goals-types build
      - run: pnpm --filter @thkp-eng/goals-core build

      - name: Check which package versions are already published
        run: |
          TYPES_VERSION=$(node -p "require('./packages/goals-types/package.json').version")
          if npm view "@thkp-eng/goals-types@$TYPES_VERSION" version >/dev/null 2>&1; then
            echo "SKIP_TYPES=true" >> $GITHUB_ENV
          fi
          CORE_VERSION=$(node -p "require('./packages/goals-core/package.json').version")
          if npm view "@thkp-eng/goals-core@$CORE_VERSION" version >/dev/null 2>&1; then
            echo "SKIP_CORE=true" >> $GITHUB_ENV
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      - name: Publish @thkp-eng/goals-types
        if: env.SKIP_TYPES != 'true'
        run: pnpm --filter @thkp-eng/goals-types publish --publish-branch master --access restricted

      - name: Publish @thkp-eng/goals-core
        if: env.SKIP_CORE != 'true'
        run: pnpm --filter @thkp-eng/goals-core publish --publish-branch master --access restricted
